version: "2"
run:
  go: "1.26.9"
  modules-download-mode: readonly
linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - decorder
    - errchkjson
    - errname
    - exhaustive
    - exptostd
    - forcetypeassert
    - misspell
    - nolintlint
    - unconvert
    - whitespace

    - thelper
    - modernize
    - unparam
    - predeclared
    - prealloc

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-specific: true
  exclusions:
    rules:
      # stdlib replacements (PublicKey.Bytes, ParseRawPrivateKey, ...) only support NIST curves, not secp256k1
      - linters:
          - staticcheck
        # matches the crypto/ecdsa X/Y/D deprecation text, which staticcheck versions quote differently
        text: 'SA1019: .*modifying the raw (coordinates|value) can produce invalid keys'
formatters:
  enable:
    - gofmt

issues:
  max-same-issues: 3
