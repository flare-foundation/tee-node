name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract changelog
        env:
          TAG: '${{ github.ref_name }}'
          REPOSITORY: '${{ github.repository }}'
        run: |
          body=$(sed -n "/^\# .*\[${TAG}\]/,/^\# .*\[v/{/^\# .*\[v/!p}" CHANGELOG.md || true)
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ${body}

          **Full Changelog**: https://github.com/${REPOSITORY}/blob/${TAG}/CHANGELOG.md
          EOF

      - name: Create release
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
          TAG: '${{ github.ref_name }}'
        run: |
          # align with build-docker.yml: stable only for strict semver tags
          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            flags=(--latest)
          else
            flags=(--prerelease --latest=false)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
